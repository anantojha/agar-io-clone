<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Blobs: eat, split, survive</title>
  <desc id="d">A multiplayer blob-eating game. 100% of the code was created by free AI coding tools (Claude).</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f171c"/>
      <stop offset="1" stop-color="#1b3a3a"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)"/>

  <!-- food -->
  <g>
    <circle cx="90" cy="70" r="7" fill="#ff6b6b"/><circle cx="210" cy="300" r="7" fill="#ffd43b"/>
    <circle cx="340" cy="40" r="7" fill="#69db7c"/><circle cx="470" cy="250" r="7" fill="#4dabf7"/>
    <circle cx="560" cy="60" r="7" fill="#f783ac"/><circle cx="720" cy="40" r="7" fill="#ffa94d"/>
    <circle cx="830" cy="230" r="7" fill="#38d9a9"/><circle cx="930" cy="60" r="7" fill="#9775fa"/>
    <circle cx="1030" cy="150" r="7" fill="#ff6b6b"/><circle cx="60" cy="200" r="7" fill="#4dabf7"/>
  </g>

  <!-- blobs -->
  <circle cx="1090" cy="120" r="95" fill="#9775fa" stroke="#000" stroke-opacity="0.25" stroke-width="6"/>
  <circle cx="1175" cy="262" r="60" fill="#38d9a9" stroke="#000" stroke-opacity="0.25" stroke-width="6"/>
  <circle cx="985" cy="262" r="38" fill="#ffa94d" stroke="#000" stroke-opacity="0.25" stroke-width="5"/>
  <circle cx="1210" cy="46" r="26" fill="#f783ac" stroke="#000" stroke-opacity="0.25" stroke-width="4"/>
  <!-- the player's blob gets a white rim, like in the game -->
  <circle cx="805" cy="140" r="70" fill="#4dabf7" stroke="#fff" stroke-width="7"/>
  <text x="805" y="150" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif"
        font-size="30" font-weight="700" fill="#fff" stroke="#000" stroke-opacity="0.45" stroke-width="3"
        paint-order="stroke">you</text>
  <text x="1090" y="130" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif"
        font-size="34" font-weight="700" fill="#fff" stroke="#000" stroke-opacity="0.45" stroke-width="3"
        paint-order="stroke">Chomp</text>
  <!-- a virus -->
  <polygon fill="#4cc25a" stroke="#2f8f3b" stroke-width="4"
    points="620,170 628,186 646,178 650,196 669,196 668,215 686,218 680,236 696,246 684,261 694,278 676,284 676,303 657,301 650,319 633,311 620,325 607,311 590,319 583,301 564,303 564,284 546,278 556,261 544,246 560,236 554,218 572,215 571,196 590,196 594,178 612,186"/>

  <!-- title -->
  <text x="60" y="165" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="108"
        font-weight="800" fill="#ffffff" letter-spacing="2">BLOBS</text>
  <text x="64" y="212" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="30"
        fill="#9fe3c8" letter-spacing="1">eat  ·  split  ·  survive</text>

  <!-- AI banner strip -->
  <rect x="0" y="288" width="1280" height="72" fill="#000" fill-opacity="0.45"/>
  <rect x="0" y="288" width="1280" height="3" fill="#4dabf7"/>
  <text x="640" y="332" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif"
        font-size="25" font-weight="600" fill="#ffffff">
    100% of this code was created by free AI coding tools (Claude)
  </text>
</svg>
